[package]
name = "bil-bond-vault"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic Bil Bond provider bond and buyer escrow contract for NEAR Testnet"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = { version = "1.5", features = ["derive"] }
near-sdk = { version = "=5.17.2", features = ["legacy"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
near-sdk = { version = "=5.17.2", features = ["unit-testing", "legacy"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
